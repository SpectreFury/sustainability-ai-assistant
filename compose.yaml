name: kuki

x-backend: &backend
  image: kuki-backend:local
  build:
    context: ./backend
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/kuki
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kuki
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kuki"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    command: ["fastapi", "run", "main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    restart: unless-stopped
    command:
      - taskiq
      - worker
      - --log-level
      - INFO
      - --workers
      - "1"
      - --max-async-tasks
      - "4"
      - --ack-type
      - when_executed
      - broker:broker
      - workers.extraction
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: kuki-frontend:local
    build:
      context: ./app
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      INTERNAL_BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
